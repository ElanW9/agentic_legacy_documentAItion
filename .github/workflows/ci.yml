# Runs the unit tests, the drift check and the doc validator on every pull request and on every push to main.
# No secrets: nothing uses a .env or calls an external service.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:  # a new push to the same branch cancels the run that is still going
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"  # the version used locally
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -v

  drift:
    # Fails when metadata/ is out of date with legacy_code/. New, changed and removed packages
    # only produce warnings and a table in the job summary: they need a doc update, not a red build.
    name: documentation drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m scripts.check_drift

  docs:
    # Validates every committed doc against metadata/, so a doc that fails, or still has a
    # !changed marker from update_package, cannot be merged.
    name: doc validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: python -m scripts.validate_doc <every doc in docs/packages and docs/flows>
        run: |
          docs=$(find docs/packages docs/flows -name '*.md' | sort)
          if [ -z "$docs" ]; then echo "no docs to validate"; exit 0; fi
          python -m scripts.validate_doc $docs
